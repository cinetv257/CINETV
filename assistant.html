<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Assistant IA bTicket — un assistant généraliste propulsé par Gemini, qui répond à toutes vos questions.">
<title>Assistant IA — bTicket</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   TOKENS (identiques au site bTicket)
   ========================================================= */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --noir:       #111318;
  --anthracite: #252A34;
  --or:         #D4AF37;
  --ivoire:     #F4F0E6;
  --blanc:      #FFFFFF;

  --noir-soft:   #171a21;
  --anthracite-2:#2f3540;
  --line:        rgba(212,175,55,.18);
  --line-soft:   rgba(255,255,255,.06);
  --texte-muted: rgba(244,240,230,.62);
  --texte-faint: rgba(244,240,230,.42);

  --font: 'Montserrat', system-ui, -apple-system, "Segoe UI", sans-serif;
  --max: 1240px;
  --radius: 20px;
  --radius-sm: 14px;
  --ease: cubic-bezier(.22,.61,.36,1);
}

html { scroll-behavior: smooth; }

body {
  background: var(--noir);
  color: var(--ivoire);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { display: block; max-width: 100%; }
textarea { font-family: inherit; }

::selection { background: var(--or); color: var(--noir); }
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--anthracite-2); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--or); }

/* =========================================================
   NAV
   ========================================================= */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 900;
  padding: 14px 0;
  background: rgba(17,19,24,.85);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  border-bottom: 1px solid var(--line);
}
.nav__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  max-width: var(--max);
  margin-inline: auto;
  padding-inline: 24px;
}
.brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.brand img { height: 34px; width: auto; }
.brand__text { font-weight: 700; font-size: 1.14rem; letter-spacing: -.015em; color: var(--blanc); }
.brand__text span { color: var(--or); }

.nav__links { display: flex; align-items: center; gap: 2px; margin-left: auto; }
.nav__links a {
  padding: 9px 14px;
  font-size: .88rem;
  font-weight: 500;
  color: var(--texte-muted);
  border-radius: 100px;
  transition: color .3s var(--ease), background .3s var(--ease);
}
.nav__links a:hover { color: var(--blanc); background: rgba(244,240,230,.05); }
.nav__links a.active { color: var(--or); }

.nav__cta { display: flex; align-items: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 12px 24px; border-radius: 100px;
  font-size: .9rem; font-weight: 600;
  transition: all .3s var(--ease); white-space: nowrap;
}
.btn--primary { background: var(--or); color: var(--noir); }
.btn--primary:hover { background: #e0bb47; transform: translateY(-2px); }
.btn--ghost {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(244,240,230,.22);
  color: var(--ivoire);
}
.btn--ghost:hover { border-color: var(--or); color: var(--or); }
.btn--sm { padding: 9px 18px; font-size: .84rem; }

.burger {
  display: none; width: 40px; height: 40px;
  border-radius: 10px; border: 1px solid var(--line);
  position: relative; flex-shrink: 0;
}
.burger span {
  position: absolute; left: 50%; width: 16px; height: 1.8px;
  background: var(--ivoire); border-radius: 2px;
  transform: translateX(-50%);
  transition: transform .35s var(--ease), opacity .25s var(--ease), top .35s var(--ease);
}
.burger span:nth-child(1) { top: 14px; }
.burger span:nth-child(2) { top: 19px; }
.burger span:nth-child(3) { top: 24px; }
.burger.open span:nth-child(1) { top: 19px; transform: translateX(-50%) rotate(45deg); }
.burger.open span:nth-child(2) { opacity: 0; }
.burger.open span:nth-child(3) { top: 19px; transform: translateX(-50%) rotate(-45deg); }

.mobile-menu {
  position: fixed; inset: 0; z-index: 890;
  background: var(--noir);
  display: flex; flex-direction: column; justify-content: center;
  padding: 100px 32px 48px;
  opacity: 0; visibility: hidden;
  transition: opacity .4s var(--ease), visibility .4s var(--ease);
}
.mobile-menu.open { opacity: 1; visibility: visible; }
.mobile-menu a {
  display: block; font-size: 1.4rem; font-weight: 600;
  padding: 14px 0; border-bottom: 1px solid var(--line-soft);
  color: var(--ivoire);
}
.mobile-menu a:hover { color: var(--or); }

/* =========================================================
   LAYOUT ASSISTANT
   ========================================================= */
.assistant {
  position: fixed;
  inset: 0;
  padding: 76px 20px 20px;
  display: flex;
  box-sizing: border-box;
}
.assistant__shell {
  flex: 1;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 16px;
  width: 100%;
  max-width: var(--max);
  margin-inline: auto;
  min-height: 0;
}

/* =========================================================
   SIDEBAR
   ========================================================= */
.sidebar {
  background: var(--noir-soft);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}
.sidebar__head { padding: 18px 18px 14px; border-bottom: 1px solid var(--line-soft); }
.sidebar__new { width: 100%; justify-content: center; gap: 8px; }
.sidebar__new svg { width: 15px; height: 15px; }

.sidebar__label {
  padding: 18px 20px 8px;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--texte-faint);
}
.sidebar__list {
  flex: 1;
  overflow-y: auto;
  padding: 0 10px 14px;
  min-height: 0;
}
.conv-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: .86rem;
  color: var(--texte-muted);
  cursor: pointer;
  transition: background .2s var(--ease), color .2s var(--ease);
  overflow: hidden;
}
.conv-item:hover { background: rgba(244,240,230,.04); color: var(--ivoire); }
.conv-item.active { background: rgba(212,175,55,.1); color: var(--ivoire); }
.conv-item__title {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.conv-item__del {
  opacity: 0;
  font-size: 16px;
  line-height: 1;
  color: var(--texte-faint);
  transition: opacity .2s, color .2s;
  padding: 2px 4px;
}
.conv-item:hover .conv-item__del { opacity: 1; }
.conv-item__del:hover { color: #ff6b6b; }

.sidebar__foot {
  padding: 14px 18px;
  border-top: 1px solid var(--line-soft);
  font-size: .72rem;
  color: var(--texte-faint);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar__status {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 10px #10b981;
}
.sidebar__status.loading { background: var(--or); box-shadow: 0 0 10px var(--or); animation: pulse 1.4s ease-in-out infinite; }
.sidebar__status.error   { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

/* =========================================================
   CHAT
   ========================================================= */
.chat {
  background: var(--noir-soft);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

.chat__head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 22px;
  border-bottom: 1px solid var(--line-soft);
  background: linear-gradient(180deg, rgba(212,175,55,.04), transparent);
}
.chat__avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #f0d267, var(--or) 70%);
  display: grid; place-items: center;
  color: var(--noir);
  flex-shrink: 0;
  box-shadow: 0 0 22px -6px var(--or);
}
.chat__avatar svg { width: 20px; height: 20px; }
.chat__head-info h1 {
  font-size: 1rem;
  font-weight: 700;
  color: var(--blanc);
  line-height: 1.2;
}
.chat__head-info p {
  font-size: .76rem;
  color: var(--texte-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.chat__head-info p i {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
}
.chat__head-info p.loading i { background: var(--or); box-shadow: 0 0 8px var(--or); animation: pulse 1.4s ease-in-out infinite; }
.chat__head-info p.error   i { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

.chat__menu {
  margin-left: auto;
  width: 34px; height: 34px;
  border-radius: 9px;
  display: grid; place-items: center;
  color: var(--texte-muted);
  transition: background .2s, color .2s;
}
.chat__menu:hover { background: rgba(244,240,230,.05); color: var(--or); }
.chat__menu svg { width: 16px; height: 16px; }

.chat__messages {
  flex: 1;
  overflow-y: auto;
  padding: 26px 22px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 0;
  scroll-behavior: smooth;
}

/* ===== Welcome ===== */
.welcome {
  margin: auto;
  text-align: center;
  max-width: 480px;
  padding: 20px;
  animation: fadeIn .6s var(--ease) both;
}
.welcome__badge {
  width: 62px; height: 62px;
  margin: 0 auto 22px;
  border-radius: 18px;
  background: radial-gradient(circle at 30% 30%, #f0d267, var(--or) 70%);
  display: grid; place-items: center;
  color: var(--noir);
  box-shadow: 0 0 40px -10px var(--or);
}
.welcome__badge svg { width: 30px; height: 30px; }
.welcome h2 {
  font-size: 1.5rem;
  margin-bottom: 10px;
  color: var(--blanc);
  letter-spacing: -.02em;
}
.welcome p {
  color: var(--texte-muted);
  font-size: .92rem;
  margin-bottom: 26px;
}
.welcome__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.chip {
  padding: 9px 16px;
  border-radius: 100px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--line);
  font-size: .8rem;
  color: var(--texte-muted);
  transition: all .25s var(--ease);
}
.chip:hover {
  border-color: var(--or);
  color: var(--or);
  background: rgba(212,175,55,.08);
  transform: translateY(-2px);
}

/* ===== Messages ===== */
.msg {
  display: flex;
  gap: 12px;
  max-width: 82%;
  animation: msgIn .35s var(--ease) both;
}
.msg--user { align-self: flex-end; flex-direction: row-reverse; }
.msg--ai   { align-self: flex-start; }

.msg__avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: grid; place-items: center;
  font-size: .7rem;
  font-weight: 700;
}
.msg--ai .msg__avatar {
  background: radial-gradient(circle at 30% 30%, #f0d267, var(--or) 70%);
  color: var(--noir);
}
.msg--ai .msg__avatar svg { width: 15px; height: 15px; }
.msg--user .msg__avatar {
  background: var(--anthracite-2);
  color: var(--ivoire);
}

.msg__bubble {
  padding: 12px 16px;
  border-radius: 16px;
  font-size: .92rem;
  line-height: 1.6;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.msg--ai .msg__bubble {
  background: var(--anthracite);
  border: 1px solid var(--line-soft);
  border-top-left-radius: 4px;
  color: var(--ivoire);
}
.msg--user .msg__bubble {
  background: var(--or);
  color: var(--noir);
  border-top-right-radius: 4px;
  font-weight: 500;
}

.msg__bubble p { margin: 0 0 .6em; }
.msg__bubble p:last-child { margin-bottom: 0; }
.msg__bubble strong { color: var(--blanc); font-weight: 700; }
.msg--user .msg__bubble strong { color: var(--noir); }
.msg__bubble em { color: var(--or); font-style: italic; }
.msg--user .msg__bubble em { color: var(--noir); }
.msg__bubble code {
  background: rgba(212,175,55,.12);
  color: var(--or);
  padding: 2px 6px;
  border-radius: 5px;
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: .85em;
}
.msg--user .msg__bubble code {
  background: rgba(0,0,0,.18);
  color: var(--noir);
}
.msg__bubble pre {
  background: var(--noir);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  overflow-x: auto;
  margin: .6em 0;
  font-size: .84rem;
}
.msg__bubble pre code {
  background: none;
  color: var(--ivoire);
  padding: 0;
}
.msg__bubble a {
  color: var(--or);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.msg__bubble ul, .msg__bubble ol { margin: .5em 0 .6em 1.3em; }
.msg__bubble li { margin-bottom: .25em; }

.msg__time {
  font-size: .66rem;
  color: var(--texte-faint);
  margin-top: 6px;
  display: block;
}

/* ===== Typing ===== */
.typing {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 4px 0;
}
.typing span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--or);
  animation: typing 1.3s ease-in-out infinite;
}
.typing span:nth-child(2) { animation-delay: .18s; }
.typing span:nth-child(3) { animation-delay: .36s; }

/* ===== Composer ===== */
.composer {
  padding: 14px 18px 18px;
  border-top: 1px solid var(--line-soft);
  background: linear-gradient(0deg, rgba(212,175,55,.03), transparent);
}
.composer__inner {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--anthracite);
  border: 1px solid var(--line-soft);
  border-radius: 18px;
  padding: 8px 8px 8px 18px;
  transition: border-color .25s var(--ease), box-shadow .25s var(--ease);
}
.composer__inner:focus-within {
  border-color: rgba(212,175,55,.5);
  box-shadow: 0 0 0 4px rgba(212,175,55,.06);
}
.composer textarea {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--ivoire);
  font-size: .94rem;
  line-height: 1.5;
  resize: none;
  max-height: 160px;
  padding: 10px 0;
  font-family: inherit;
}
.composer textarea::placeholder { color: var(--texte-faint); }

.composer__send {
  width: 42px; height: 42px;
  border-radius: 13px;
  background: var(--or);
  color: var(--noir);
  display: grid; place-items: center;
  flex-shrink: 0;
  transition: all .25s var(--ease);
}
.composer__send:hover:not(:disabled) {
  background: #e0bb47;
  transform: translateY(-1px);
  box-shadow: 0 8px 20px -8px var(--or);
}
.composer__send:disabled { opacity: .35; cursor: not-allowed; }
.composer__send svg { width: 18px; height: 18px; }

.composer__hint {
  text-align: center;
  font-size: .68rem;
  color: var(--texte-faint);
  margin-top: 10px;
  letter-spacing: .04em;
}
.composer__hint kbd {
  background: rgba(244,240,230,.06);
  border: 1px solid var(--line-soft);
  padding: 1px 6px;
  border-radius: 5px;
  font-family: inherit;
  font-size: .95em;
}

/* =========================================================
   ANIMATIONS
   ========================================================= */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); opacity: .5; }
  30%           { transform: translateY(-4px); opacity: 1; }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .45; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 900px) {
  .nav__links { display: none; }
  .burger { display: block; }
  .nav__cta .btn { display: none; }

  .assistant { padding: 72px 12px 12px; }
  .assistant__shell { grid-template-columns: 1fr; }

  .sidebar {
    position: fixed;
    top: 72px; left: 12px; bottom: 12px;
    width: 280px;
    max-width: calc(100vw - 24px);
    z-index: 800;
    transform: translateX(calc(-100% - 20px));
    transition: transform .35s var(--ease);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.8);
  }
  .sidebar.open { transform: translateX(0); }

  .chat__messages { padding: 20px 16px; }
  .msg { max-width: 92%; }
}

@media (max-width: 480px) {
  .chat__head { padding: 12px 16px; gap: 10px; }
  .chat__avatar { width: 36px; height: 36px; }
  .chat__head-info h1 { font-size: .92rem; }
  .composer { padding: 10px 12px 14px; }
  .composer__inner { padding: 6px 6px 6px 14px; }
  .composer__send { width: 38px; height: 38px; }
}
</style>
</head>
<body>

<!-- ===================== NAV ===================== -->
<header class="nav">
  <div class="nav__inner">
    <a href="index.html" class="brand">
      <img src="IMAGES/logo.png" alt="bTicket">
      <span class="brand__text">b<span>Ticket</span></span>
    </a>

    <nav class="nav__links">
      <a href="index.html">Accueil</a>
      <a href="application.html">Application</a>
      <a href="organisateurs.html">Organisateurs</a>
      <a href="agents.html">Agents</a>
      <a href="tarifs.html">Tarifs</a>
      <a href="a-propos.html">À propos</a>
      <a href="assistant.html" class="active">Assistant</a>
    </nav>

    <div class="nav__cta">
      <a href="telecharger.html" class="btn btn--primary btn--sm">Télécharger</a>
      <button class="burger" id="burger" aria-label="Ouvrir le menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- ===================== MENU MOBILE ===================== -->
<div class="mobile-menu" id="mobileMenu">
  <a href="index.html">Accueil</a>
  <a href="application.html">Application</a>
  <a href="organisateurs.html">Organisateurs</a>
  <a href="agents.html">Agents</a>
  <a href="tarifs.html">Tarifs</a>
  <a href="a-propos.html">À propos</a>
  <a href="assistant.html">Assistant</a>
</div>

<!-- ===================== ASSISTANT ===================== -->
<main class="assistant">
  <div class="assistant__shell">

    <!-- ==== SIDEBAR ==== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <button class="btn btn--ghost btn--sm sidebar__new" id="newChat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Nouvelle conversation
        </button>
      </div>

      <div class="sidebar__label">Historique</div>
      <div class="sidebar__list" id="convList"></div>

      <div class="sidebar__foot">
        <span class="sidebar__status loading" id="statusDot"></span>
        <span id="modeLabel">Connexion à l'IA…</span>
      </div>
    </aside>

    <!-- ==== CHAT ==== -->
    <section class="chat">
      <header class="chat__head">
        <div class="chat__avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l1.9 5.6L19.5 9.5l-4.6 3.4L16 18.5 12 15.4 8 18.5l1.1-5.6L4.5 9.5l5.6-1.9L12 2z"/>
          </svg>
        </div>
        <div class="chat__head-info">
          <h1>Assistant IA</h1>
          <p id="chatStatus"><i></i> <span>Connexion…</span></p>
        </div>
        <button class="chat__menu" id="toggleSidebar" aria-label="Historique">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M3 12h18M3 18h18"/>
          </svg>
        </button>
      </header>

      <div class="chat__messages" id="messages"></div>

      <form class="composer" id="composer">
        <div class="composer__inner">
          <textarea
            id="input"
            rows="1"
            placeholder="Posez n'importe quelle question…"
            autocomplete="off"
            spellcheck="true"></textarea>
          <button type="submit" class="composer__send" id="send" disabled aria-label="Envoyer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
        <div class="composer__hint">
          <kbd>Entrée</kbd> pour envoyer · <kbd>Maj</kbd> + <kbd>Entrée</kbd> pour un saut de ligne
        </div>
      </form>
    </section>

  </div>
</main>

<script type="module">
/* =========================================================
   ASSISTANT IA — bTicket · page dédiée
   ---------------------------------------------------------
   Combine :
   • l'interface de la page Assistant (sidebar + chat plein écran)
   • le moteur Firebase AI / Gemini (App Check, multi-modèles)
   • la persistance locale de l'historique
   • l'IA répond à TOUTES les questions (system prompt généraliste)
   ========================================================= */

/* =========================================================
   1. CONFIGURATION
   ========================================================= */
const VERSION_FIREBASE = '13.0.0';

const firebaseConfig = {
  apiKey: "AIzaSyBcf1eysXtdI5vOgI02yd8sCFs3wGWJ90A",
  authDomain: "bticket-burundi.firebaseapp.com",
  databaseURL: "https://bticket-burundi-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bticket-burundi",
  storageBucket: "bticket-burundi.firebasestorage.app",
  messagingSenderId: "407762427157",
  appId: "1:407762427157:web:1e0f2ef5458fdbaa575d1c",
  measurementId: "G-J60JBTZ647"
};

// Clé reCAPTCHA Enterprise (site) — pour App Check
const CLE_SITE_RECAPTCHA = '6LfCFfEtAAAAAFhBn3JVI6cZ8qIp7tOafOjYkWDC';

// Modèles essayés dans l'ordre : si l'un échoue, on passe au suivant
const MODELES = ["gemini-3.8-flash", "gemini-3.5-flash", "gemini-3.1-flash-lite"];

// Prompt système — ASSISTANT GÉNÉRALISTE (pas seulement bTicket)
const CONSIGNE_BASE =
  "Tu es un assistant IA généraliste, utile, précis et bienveillant. " +
  "Tu réponds à TOUTES les questions, pas seulement celles liées à la billetterie ou à bTicket. " +
  "Tu peux aider en culture générale, sciences, histoire, mathématiques, programmation, " +
  "rédaction, traduction, conseils pratiques, cuisine, voyages, santé (sans diagnostic médical), etc. " +
  "Réponds en français par défaut, sauf si l'utilisateur écrit dans une autre langue. " +
  "Sois concis mais complet, utilise des listes et du Markdown quand c'est utile. " +
  "Si tu ne sais pas, dis-le honnêtement. " +
  "Tu es intégré au site bTicket, tu peux donc aussi aider sur ce sujet si on te le demande.";

const CLE_STOCKAGE = 'bticket_assistant_v1';

/* =========================================================
   2. INIT UI / ÉTAT
   ========================================================= */
document.body.classList.add('js-ready');

const state = {
  conversations: [],
  currentId: null,
  isSending: false,
  isReady: false,
  lastError: null
};

const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');
const convListEl = $('convList');
const input = $('input');
const sendBtn = $('send');
const form = $('composer');
const statusDot = $('statusDot');
const modeLabel = $('modeLabel');
const chatStatus = $('chatStatus');

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* =========================================================
   3. PERSISTANCE
   ========================================================= */
function loadState() {
  try {
    const raw = localStorage.getItem(CLE_STOCKAGE);
    if (raw) {
      const data = JSON.parse(raw);
      state.conversations = Array.isArray(data.conversations) ? data.conversations : [];
      state.currentId = data.currentId || null;
    }
  } catch (e) { /* ignore */ }

  if (!state.conversations.length) createConversation(false);
  if (!state.conversations.find(c => c.id === state.currentId)) {
    state.currentId = state.conversations[0].id;
  }
}

function saveState() {
  try {
    localStorage.setItem(CLE_STOCKAGE, JSON.stringify({
      conversations: state.conversations,
      currentId: state.currentId
    }));
  } catch (e) { /* ignore */ }
}

function currentConv() {
  return state.conversations.find(c => c.id === state.currentId);
}

function createConversation(render = true) {
  const conv = {
    id: uid(),
    title: "Nouvelle conversation",
    createdAt: Date.now(),
    messages: []
  };
  state.conversations.unshift(conv);
  state.currentId = conv.id;
  saveState();
  if (render) {
    renderConversations();
    renderMessages();
    input.focus();
  }
  return conv;
}

function deleteConversation(id) {
  const idx = state.conversations.findIndex(c => c.id === id);
  if (idx === -1) return;
  state.conversations.splice(idx, 1);
  if (!state.conversations.length) createConversation(false);
  if (state.currentId === id) state.currentId = state.conversations[0].id;
  saveState();
  renderConversations();
  renderMessages();
}

/* =========================================================
   4. RENDU — SIDEBAR
   ========================================================= */
function renderConversations() {
  convListEl.innerHTML = '';
  state.conversations.forEach(conv => {
    const item = document.createElement('div');
    item.className = 'conv-item' + (conv.id === state.currentId ? ' active' : '');
    item.innerHTML = `
      <span class="conv-item__title"></span>
      <button class="conv-item__del" title="Supprimer" aria-label="Supprimer">×</button>
    `;
    item.querySelector('.conv-item__title').textContent = conv.title;

    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('conv-item__del')) return;
      state.currentId = conv.id;
      saveState();
      renderConversations();
      renderMessages();
    });

    item.querySelector('.conv-item__del').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteConversation(conv.id);
    });

    convListEl.appendChild(item);
  });
}

/* =========================================================
   5. RENDU — MESSAGES
   ========================================================= */
function renderMessages() {
  const conv = currentConv();
  messagesEl.innerHTML = '';

  if (!conv || !conv.messages.length) {
    messagesEl.appendChild(buildWelcome());
    return;
  }
  conv.messages.forEach(m => {
    messagesEl.appendChild(buildMessage(m.role, m.content, m.time, false));
  });
  scrollToBottom();
}

function buildWelcome() {
  const wrap = document.createElement('div');
  wrap.className = 'welcome';
  wrap.innerHTML = `
    <div class="welcome__badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l1.9 5.6L19.5 9.5l-4.6 3.4L16 18.5 12 15.4 8 18.5l1.1-5.6L4.5 9.5l5.6-1.9L12 2z"/>
      </svg>
    </div>
    <h2>Bonjour 👋</h2>
    <p>Je suis un assistant IA généraliste. Posez-moi n'importe quelle question : sciences, histoire, code, rédaction, voyage…</p>
    <div class="welcome__chips">
      <button class="chip" data-q="Explique-moi la photosynthèse simplement.">Explique la photosynthèse</button>
      <button class="chip" data-q="Donne-moi 5 idées de recettes rapides pour ce soir.">Idées recettes rapides</button>
      <button class="chip" data-q="Écris une fonction JavaScript qui inverse une chaîne de caractères.">Code JavaScript</button>
      <button class="chip" data-q="Quels sont les meilleurs endroits à visiter au Burundi ?">Voyager au Burundi</button>
    </div>
  `;
  wrap.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => sendMessage(btn.getAttribute('data-q')));
  });
  return wrap;
}

function buildMessage(role, content, time, animate = true) {
  const msg = document.createElement('div');
  msg.className = `msg msg--${role === 'user' ? 'user' : 'ai'}`;
  if (!animate) msg.style.animation = 'none';

  const avatar = document.createElement('div');
  avatar.className = 'msg__avatar';
  if (role === 'user') {
    avatar.textContent = 'V';
  } else {
    avatar.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l1.9 5.6L19.5 9.5l-4.6 3.4L16 18.5 12 15.4 8 18.5l1.1-5.6L4.5 9.5l5.6-1.9L12 2z"/>
      </svg>`;
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg__bubble';
  bubble.innerHTML = role === 'user' ? escapeHtml(content) : renderMarkdown(content);

  if (time) {
    const t = document.createElement('span');
    t.className = 'msg__time';
    t.textContent = formatTime(time);
    bubble.appendChild(t);
  }
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  return msg;
}

function buildTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg msg--ai';
  msg.id = 'typingIndicator';
  msg.innerHTML = `
    <div class="msg__avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l1.9 5.6L19.5 9.5l-4.6 3.4L16 18.5 12 15.4 8 18.5l1.1-5.6L4.5 9.5l5.6-1.9L12 2z"/>
      </svg>
    </div>
    <div class="msg__bubble">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>
  `;
  return msg;
}

function scrollToBottom() {
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

/* =========================================================
   6. MARKDOWN MINIMAL
   ========================================================= */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

function renderMarkdown(text) {
  let html = escapeHtml(text);

  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${code.replace(/\n$/, '')}</code></pre>`);
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
  html = html.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');

  // liens internes (pages du site)
  html = html.replace(/\[([^\]]+)\]\(((?:index|application|organisateurs|agents|tarifs|a-propos|telecharger|assistant)\.html(?:#[\w-]+)?)\)/g,
    '<a href="$2">$1</a>');
  // liens externes
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  // listes
  html = html.replace(/(?:^|\n)((?:[-*] .+(?:\n|$))+)/g, (block) => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^[-*]\s+/, '')}</li>`).join('');
    return `\n<ul>${items}</ul>`;
  });
  html = html.replace(/(?:^|\n)((?:\d+\. .+(?:\n|$))+)/g, (block) => {
    const items = block.trim().split('\n').map(l => `<li>${l.replace(/^\d+\.\s+/, '')}</li>`).join('');
    return `\n<ol>${items}</ol>`;
  });

  // paragraphes
  html = html.split(/\n{2,}/).map(p => {
    const trimmed = p.trim();
    if (!trimmed) return '';
    if (/^<(ul|ol|pre|h[1-6]|blockquote)/.test(trimmed)) return trimmed;
    return `<p>${trimmed.replace(/\n/g, '<br>')}</p>`;
  }).join('');

  return html;
}

/* =========================================================
   7. CHARGEMENT DU MOTEUR IA (Firebase AI / Gemini)
   ========================================================= */
let promesseIA = null;

function setStatus(kind, text) {
  statusDot.classList.remove('loading', 'error');
  chatStatus.classList.remove('loading', 'error');
  if (kind === 'loading') { statusDot.classList.add('loading'); chatStatus.classList.add('loading'); }
  if (kind === 'error')   { statusDot.classList.add('error');   chatStatus.classList.add('error');   }
  modeLabel.textContent = text;
  chatStatus.querySelector('span').textContent = text;
}

function chargerIA() {
  if (promesseIA) return promesseIA;

  promesseIA = (async function () {
    setStatus('loading', "Connexion à l'IA…");
    const base = `https://www.gstatic.com/firebasejs/${VERSION_FIREBASE}/`;

    const mods = await Promise.all([
      import(base + 'firebase-app.js'),
      import(base + 'firebase-ai.js'),
      import(base + 'firebase-app-check.js')
    ]);
    const appMod = mods[0], aiMod = mods[1], checkMod = mods[2];

    const app = appMod.initializeApp(firebaseConfig);

    // App Check (reCAPTCHA Enterprise) — optionnel mais recommandé
    try {
      checkMod.initializeAppCheck(app, {
        provider: new checkMod.ReCaptchaEnterpriseProvider(CLE_SITE_RECAPTCHA),
        isTokenAutoRefreshEnabled: true
      });
    } catch (e) {
      console.warn('App Check non initialisé :', e);
    }

    const ai = aiMod.getAI(app, { backend: new aiMod.GoogleAIBackend() });

    const modeles = MODELES.map(nom =>
      aiMod.getGenerativeModel(ai, { model: nom, systemInstruction: CONSIGNE_BASE })
    );

    state.isReady = true;
    setStatus('ready', 'En ligne');
    return modeles;
  })();

  promesseIA.catch((err) => {
    console.error('Échec du chargement IA :', err);
    state.lastError = err;
    promesseIA = null;
    setStatus('error', 'Hors ligne');
  });

  return promesseIA;
}

// Précharge le moteur dès l'ouverture de la page
chargerIA().catch(() => {});

/* =========================================================
   8. ENVOI DE MESSAGE
   ========================================================= */
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  sendBtn.disabled = !input.value.trim() || state.isSending;
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) form.requestSubmit();
  }
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || state.isSending) return;
  sendMessage(text);
});

async function sendMessage(text) {
  const conv = currentConv();
  if (!conv) return;

  conv.messages.push({ role: 'user', content: text, time: Date.now() });
  if (conv.title === "Nouvelle conversation") {
    conv.title = text.length > 42 ? text.slice(0, 42).trim() + '…' : text;
  }

  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  state.isSending = true;

  renderConversations();
  renderMessages();
  messagesEl.appendChild(buildTyping());
  scrollToBottom();

  let reply = '';
  try {
    reply = await getAIResponse(conv.messages);
  } catch (err) {
    console.error(err);
    reply = "⚠️ Une erreur est survenue lors de la connexion à l'IA. Vérifiez votre connexion internet et réessayez.";
    setStatus('error', 'Hors ligne');
  }

  const typing = document.getElementById('typingIndicator');
  if (typing) typing.remove();

  conv.messages.push({ role: 'assistant', content: reply, time: Date.now() });
  saveState();
  renderMessages();

  state.isSending = false;
  sendBtn.disabled = !input.value.trim();
  input.focus();
}

/* =========================================================
   9. APPEL IA (Gemini multi-modèles)
   ========================================================= */
async function getAIResponse(history) {
  const modeles = await chargerIA();
  if (!modeles || !modeles.length) throw new Error('Aucun modèle IA disponible.');

  // Convertit l'historique au format Gemini
  // (on limite à 20 tours pour garder le contexte raisonnable)
  const contenu = history.slice(-20).map(m => ({
    role: m.role === 'user' ? 'user' : 'model',
    parts: [{ text: m.content }]
  }));

  let derniereErreur = null;
  for (let i = 0; i < modeles.length; i++) {
    try {
      const result = await modeles[i].generateContent({ contents: contenu });
      const txt = result.response.text();
      if (txt) {
        setStatus('ready', 'En ligne');
        return txt;
      }
    } catch (e) {
      console.warn(`Modèle ${MODELES[i]} en échec :`, e);
      derniereErreur = e;
    }
  }
  throw derniereErreur || new Error('Aucun modèle n\'a pu répondre.');
}

/* =========================================================
   10. UI — BURGER, SIDEBAR, NOUVELLE CONVERSATION
   ========================================================= */
const burger = document.getElementById('burger');
const mobileMenu = document.getElementById('mobileMenu');

burger.addEventListener('click', () => {
  const open = !mobileMenu.classList.contains('open');
  mobileMenu.classList.toggle('open', open);
  burger.classList.toggle('open', open);
  document.body.style.overflow = open ? 'hidden' : '';
});
mobileMenu.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    mobileMenu.classList.remove('open');
    burger.classList.remove('open');
    document.body.style.overflow = '';
  });
});

$('newChat').addEventListener('click', () => {
  createConversation();
  $('sidebar').classList.remove('open');
});

$('toggleSidebar').addEventListener('click', () => {
  $('sidebar').classList.toggle('open');
});

/* =========================================================
   11. INIT
   ========================================================= */
loadState();
renderConversations();
renderMessages();
input.focus();
</script>
